name: pixel-engine-nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-engine-nightly
  cancel-in-progress: false

jobs:
  instrumentation:
    name: Emulator API ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run full instrumentation matrix entry
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            rm -rf pixel-engine/build/outputs/androidTest-results pixel-engine/build/reports/androidTests pixel-engine/build/outputs/connected_android_test_additional_output
            ANDROID_SERIAL=emulator-5554 ./gradlew :pixel-engine:connectedDebugAndroidTest --no-build-cache --no-daemon
      - name: Upload emulator reports and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-instrumentation-api${{ matrix.api-level }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            pixel-engine/build/outputs/androidTest-results/**
            pixel-engine/build/reports/androidTests/**
            pixel-engine/build/reports/golden/**
            pixel-engine/build/outputs/connected_android_test_additional_output/**

  macrobenchmark:
    name: API 36 emulator macrobenchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run macrobenchmark on an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            rm -rf pixel-benchmark/build/outputs/connected_android_test_additional_output pixel-benchmark/build/outputs/androidTest-results
            PIXEL_BENCHMARK_SERIAL=emulator-5554 PIXEL_BENCHMARK_TEST_CLASS=com.purride.pixelbenchmark.PixelMacrobenchmark bash tools/pixel-connected-benchmark.sh :pixel-benchmark:connectedBenchmarkReleaseAndroidTest --no-build-cache --no-daemon
      - name: Upload benchmark messages traces and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-macrobenchmark-api36-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            pixel-benchmark/build/outputs/androidTest-results/**
            pixel-benchmark/build/outputs/connected_android_test_additional_output/**
            build/reports/performance/**
            **/*.perfetto-trace

  soak:
    name: API 36 emulator 30-minute device soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run exact 10,000-cycle stress and 30-minute device soak
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            PIXEL_BENCHMARK_SERIAL=emulator-5554 PIXEL_SOAK_DURATION_SECONDS=1800 PIXEL_SOAK_SAMPLE_INTERVAL_SECONDS=60 bash tools/pixel-device-soak.sh
      - name: Upload soak test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-soak-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            pixel-engine/build/test-results/**
            pixel-engine/build/reports/tests/**
            pixel-benchmark/build/outputs/androidTest-results/**
            pixel-benchmark/build/outputs/connected_android_test_additional_output/**
            build/reports/performance/device-soak/**

  required:
    name: Required nightly gate
    if: always()
    needs:
      - instrumentation
      - macrobenchmark
      - soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout required gate
        uses: actions/checkout@v6
      - name: Reject every non-success upstream result
        run: >-
          bash tools/pixel-ci-required-check.sh
          "${{ needs.instrumentation.result }}"
          "${{ needs.macrobenchmark.result }}"
          "${{ needs.soak.result }}"
