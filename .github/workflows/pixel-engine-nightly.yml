name: pixel-engine-nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-engine-nightly
  cancel-in-progress: false

jobs:
  instrumentation:
    name: Emulator API ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run full instrumentation matrix entry
        uses: reactivecircus/android-emulator-runner@v2
        env:
          JAVA_TOOL_OPTIONS: -Dddmlib.getprop.timeout.sec=30
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            rm -rf pixel-engine/build/outputs/androidTest-results pixel-engine/build/reports/androidTests pixel-engine/build/outputs/connected_android_test_additional_output
            # device_api 保存已观察 SDK；attempt 最多重试 12 次并确认它与当前矩阵项一致。
            device_api=""; for attempt in $(seq 1 12); do device_api="$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"; [ "$device_api" = "${{ matrix.api-level }}" ] && break; sleep 5; done; [ "$device_api" = "${{ matrix.api-level }}" ] || { echo "Expected emulator API ${{ matrix.api-level }}, got: $device_api" >&2; exit 1; }
            ANDROID_SERIAL=emulator-5554 ./gradlew :pixel-engine:connectedDebugAndroidTest --no-build-cache --no-daemon
      - name: Upload emulator reports and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-instrumentation-api${{ matrix.api-level }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            pixel-engine/build/outputs/androidTest-results/**
            pixel-engine/build/reports/androidTests/**
            pixel-engine/build/reports/golden/**
            pixel-engine/build/outputs/connected_android_test_additional_output/**

  required:
    name: Required nightly gate
    if: always()
    needs:
      - instrumentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout required gate
        uses: actions/checkout@v6
      - name: Reject every non-success upstream result
        run: >-
          bash tools/pixel-ci-required-check.sh
          "${{ needs.instrumentation.result }}"
