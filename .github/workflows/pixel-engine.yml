name: pixel-engine-required

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "xiangyu/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-engine-required-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast unit and golden
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python for pixel font tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-fonts.txt
      - name: Install pixel font tooling dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements-fonts.txt
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Verify dependency metadata from an empty Gradle home
        # 独立用户目录强制重新读取原始 POM/module，避免共享缓存掩盖校验闭包缺项。
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/pixel-cold-gradle-home
        run: >-
          ./gradlew help :pixel-engine:dependencies :pixel-engine:assembleDebugAndroidTest
          --no-build-cache --no-daemon --console=plain
      - name: Run fast gate from a clean output tree
        run: bash tools/pixel-ci-fast.sh
      - name: Upload fast reports and golden diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            **/build/reports/golden/**
            build/reports/security/**

  api:
    name: API ABI and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up pinned documentation Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run API and strict documentation gate
        run: bash tools/pixel-ci-api.sh
      - name: Upload API signatures and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/api/**
            **/build/reports/compatibility/**
            build/mkdocs-site/**

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run lint gate
        run: bash tools/pixel-ci-lint.sh
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/lint-results-*
            **/build/intermediates/lint*/**

  instrumentation:
    name: API 29 emulator instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the instrumentation APK before emulator startup
        run: ./gradlew :pixel-engine:assembleDebugAndroidTest --no-build-cache --no-daemon
      - name: Run instrumentation on an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          JAVA_TOOL_OPTIONS: -Dddmlib.getprop.timeout.sec=30
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            rm -rf pixel-engine/build/outputs/androidTest-results pixel-engine/build/reports/androidTests pixel-engine/build/outputs/connected_android_test_additional_output
            # device_api 保存已观察 SDK；attempt 最多重试 12 次，避免尚未就绪的设备进入 ddmlib。
            device_api=""; for attempt in $(seq 1 12); do device_api="$(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"; [ "$device_api" = "29" ] && break; sleep 5; done; [ "$device_api" = "29" ] || { echo "Expected emulator API 29, got: $device_api" >&2; exit 1; }
            # package_ready 只有在包管理服务能完成真实查询后才置为 yes，避免启动完成标志早于系统服务。
            package_ready=""; for attempt in $(seq 1 30); do if adb -s emulator-5554 shell cmd package list packages >/dev/null 2>&1; then package_ready="yes"; break; fi; sleep 5; done; [ "$package_ready" = "yes" ] || { echo "Android package service did not become ready" >&2; exit 1; }
            ANDROID_SERIAL=emulator-5554 ./gradlew :pixel-engine:connectedDebugAndroidTest --no-build-cache --no-daemon
      - name: Upload instrumentation XML golden diffs and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-api29-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            pixel-engine/build/outputs/androidTest-results/**
            pixel-engine/build/reports/androidTests/**
            pixel-engine/build/reports/golden/**
            pixel-engine/build/outputs/connected_android_test_additional_output/**

  consumer:
    name: External consumers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Run isolated Maven consumers and compatibility matrix
        run: bash tools/pixel-ci-consumer.sh
      - name: Upload consumer reports and inspected AAR repository
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/reports/compatibility/**
            build/compatibility-repository/**

  publication:
    name: Publication metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Publish and inspect the unified coordinate
        run: bash tools/pixel-publication-validation.sh
      - name: Upload publication report and Maven payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publication-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/reports/compatibility/publication.json
            build/compatibility-repository/**

  supply_chain:
    name: Signed staging and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v6
      - name: Set up required Android SDK platforms
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 platforms;android-36.1
      - name: Publish signed staging, scan dependencies, and consume over HTTP
        env:
          # 正式供应链门禁必须验证 Apache-2.0 LICENSE、POM 与 SBOM 一致。
          PIXEL_REQUIRE_LICENSE: "1"
        run: bash tools/pixel-supply-chain-check.sh
      - name: Upload SBOM provenance signatures and remote consumer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-reports-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/reports/supply-chain/**
            build/reports/compatibility/m8-2/**
            build/m9-staging-repository/**

  required:
    name: Required pixel-engine gate
    if: always()
    needs:
      - fast
      - api
      - lint
      - instrumentation
      - consumer
      - publication
      - supply_chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout required gate
        uses: actions/checkout@v6
      - name: Reject every non-success upstream result
        run: >-
          bash tools/pixel-ci-required-check.sh
          "${{ needs.fast.result }}"
          "${{ needs.api.result }}"
          "${{ needs.lint.result }}"
          "${{ needs.instrumentation.result }}"
          "${{ needs.consumer.result }}"
          "${{ needs.publication.result }}"
          "${{ needs.supply_chain.result }}"
